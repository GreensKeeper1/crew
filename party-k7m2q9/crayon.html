 BR.push(16/60);BR.splice(0,BR.length-TN);   // keep arrays the same length
 {const yb=y0+h*0.3;x.strokeStyle="#cdb4f0";x.lineWidth=1.5;x.globalAlpha=.9;x.beginPath();                                // iNeeda breathing rate trend, pastel purple (owner ~21:0x)
